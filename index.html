<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCXIMA · Nodo Activo</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace; }
    :root {
      --fondo: #04060F;
      --caja: #0D1120;
      --borde: #1C2640;
      --verde: #7FFF9E;
      --rojo: #FF5C72;
      --texto: #E8EAF0;
      --gris: #3E4F6E;
    }
    body {
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .malla {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--borde) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.4;
      z-index: 0;
    }
    .contenedor {
      width: 100%;
      max-width: 400px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .cabecera {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .titulo {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: white;
    }
    .estado {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--rojo);
    }
    .estado.online {
      color: var(--verde);
    }
    .punto {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      animation: parpadeo 2s infinite;
    }
    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .marco-qr {
      background: white;
      padding: 1rem;
      border-radius: 4px;
      margin: 0 auto;
    }
    #qr {
      width: 220px;
      height: 220px;
      display: block;
    }
    .enlace {
      width: 100%;
      background: var(--caja);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 1rem;
      color: var(--verde);
      word-break: break-all;
      position: relative;
    }
    .copiar {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gris);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .boton-detalles {
      width: 100%;
      background: none;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 1rem;
      color: var(--gris);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .panel-detalles {
      border: 1px solid var(--borde);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    .fila {
      display: flex;
      justify-content: space-between;
    }
    input {
      width: 100%;
      background: var(--fondo);
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 0.7rem;
      color: var(--texto);
    }
    .boton-sinc {
      background: var(--verde);
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      color: var(--fondo);
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="malla"></div>
  <div class="contenedor">
    <div class="cabecera">
      <div class="titulo">SOCXIMA</div>
      <div class="estado" id="estado">
        <div class="punto"></div>
        <span>FALLBACK</span>
      </div>
    </div>

    <div class="marco-qr">
      <canvas id="qr" width="220" height="220"></canvas>
    </div>

    <div class="enlace" id="enlace">
      socxima://connect?node=SOCXIMA-V3
      <button class="copiar" onclick="copiarEnlace()">⧉</button>
    </div>

    <button class="boton-detalles" onclick="mostrarDetalles()">
      Detalles del nodo <span>▼</span>
    </button>

    <div class="panel-detalles" id="panel">
      <div class="fila"><span>ID:</span><span id="id-nodo">---</span></div>
      <div class="fila"><span>Activo desde:</span><span id="fecha">---</span></div>
      <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
        <input type="text" id="ruta" value="http://127.0.0.1:8080/estado">
        <button class="boton-sinc" onclick="sincronizar()">SYNC</button>
      </div>
    </div>
  </div>

  <script>
    function dibujarQR(texto) {
      const canvas = document.getElementById('qr');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 220, 220);
      ctx.fillStyle = '#04060F';
      let x = 10, y = 10;
      for (const caracter of texto) {
        const codigo = caracter.charCodeAt(0);
        for (let bit = 0; bit < 8; bit++) {
          if (codigo & (1 << bit)) {
            ctx.fillRect(x, y, 4, 4);
          }
          x += 4;
          if (x > 210) {
            x = 10;
            y += 4;
          }
        }
      }
    }

    function cambiarEstado(activo) {
      const estado = document.getElementById('estado');
      if (activo) {
        estado.classList.add('online');
        estado.querySelector('span').textContent = 'ONLINE';
      } else {
        estado.classList.remove('online');
        estado.querySelector('span').textContent = 'FALLBACK';
      }
    }

    function mostrarDetalles() {
      const panel = document.getElementById('panel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }

    function copiarEnlace() {
      const texto = document.getElementById('enlace').textContent.trim();
      navigator.clipboard.writeText(texto);
    }

    async function sincronizar() {
      const url = document.getElementById('ruta').value.trim();
      try {
        const respuesta = await fetch(url, { signal: AbortSignal.timeout(4000) });
        if (!respuesta.ok) throw new Error('Sin respuesta');
        const datos = await respuesta.json();
        document.getElementById('id-nodo').textContent = datos.id;
        document.getElementById('fecha').textContent = datos.activo_desde;
        document.getElementById('enlace').firstChild.textContent = datos.invitacion_qr;
        dibujarQR(datos.invitacion_qr);
        cambiarEstado(true);
      } catch {
        cambiarEstado(false);
      }
    }

    window.onload = () => dibujarQR('socxima://connect?node=SOCXIMA-V3');
  </script>
</body>
</html>
