<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SOCXIMA · Red Descentralizada</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    :root {
      --bg: #04060F; --s1: #0A0E1C; --border: #1A2438;
      --green: #7FFF9E; --text: #E0E6F0; --muted: #3A4D6A; --danger: #FF5C72;
    }
    body { background: var(--bg); color: var(--text); padding: 1.5rem; max-width: 480px; margin: 0 auto; }
    .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; letter-spacing: 0.15em; color: #fff; }
    .estado { padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; border: 1px solid; }
    .fallback { color: var(--danger); border-color: rgba(255,92,114,0.3); }
    .online { color: var(--green); border-color: rgba(127,255,158,0.3); }
    .subtitulo { text-align: center; text-transform: uppercase; font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; }
    .marco-qr { width: 220px; height: 220px; margin: 0 auto 1.5rem; border: 2px solid #FF4488; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #F4F4EE; }
    .marco-qr img { width: 100%; height: 100%; object-fit: contain; }
    .texto-escaneo { text-align: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem; }
    .enlace { background: var(--s1); border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem; text-align: center; color: var(--green); font-family: monospace; margin-bottom: 1.5rem; word-break: break-all; }
    .detalles { background: var(--s1); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; margin-bottom: 1.5rem; }
    .detalles h3 { text-transform: uppercase; font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }
    .fila { display: flex; justify-content: space-between; margin-bottom: 0.7rem; font-size: 0.9rem; }
    .etiqueta { color: var(--muted); }
    .valor { color: var(--text); }
    .barra-sync { display: flex; gap: 0.7rem; margin-top: 1.2rem; }
    input { flex: 1; background: var(--bg); border: 1px solid var(--green); border-radius: 6px; padding: 0.8rem; color: #fff; font-size: 1rem; }
    button { background: var(--green); border: none; border-radius: 6px; padding: 0.8rem 1.2rem; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="cabecera">
    <h1>SOCXIMA</h1>
    <div id="estado-nodo" class="estado fallback">FALLBACK</div>
  </div>

  <p class="subtitulo">TU NODO ACTIVO</p>

  <div class="marco-qr" id="zona-qr">
    <img src="qr_socxima_motor.png" alt="QR Socxima Nodo" id="imagen-qr">
  </div>

  <p class="texto-escaneo">Escanea para unirte a este nodo</p>

  <div class="enlace" id="enlace-conectar">socxima://connect?node=RedSOCXIMA-V3-ALPHA-88</div>

  <div class="detalles">
    <h3>DETALLES DEL NODO</h3>

    <div class="fila">
      <span class="etiqueta">ID</span>
      <span class="valor" id="id-nodo">RedSOCXIMA-V3-ALPHA-88</span>
    </div>
    <div class="fila">
      <span class="etiqueta">Firmware</span>
      <span class="valor" id="version-nodo">3.5.2-LTS-MESH</span>
    </div>
    <div class="fila">
      <span class="etiqueta">Activo desde</span>
      <span class="valor" id="activo-desde">—</span>
    </div>

    <div class="barra-sync">
      <input type="text" id="direccion-api" value="http://127.0.0.1:8080/estado">
      <button id="boton-sync" onclick="sincronizar()">SYNC</button>
    </div>
  </div>

  <script>
    async function sincronizar() {
      const url = document.getElementById('direccion-api').value.trim();
      const estado = document.getElementById('estado-nodo');
      const idNodo = document.getElementById('id-nodo');
      const version = document.getElementById('version-nodo');
      const activo = document.getElementById('activo-desde');
      const qr = document.getElementById('imagen-qr');

      estado.textContent = "CONECTANDO";
      estado.className = "estado fallback";

      try {
        const res = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-cache',
          signal: AbortSignal.timeout(6000)
        });
        if (!res.ok) throw new Error("Sin respuesta");
        const datos = await res.json();

        estado.textContent = "ONLINE";
        estado.className = "estado online";
        idNodo.textContent = datos.id || "RedSOCXIMA-V3-ALPHA-88";
        version.textContent = datos.version || "3.5.2-LTS-MESH";
        activo.textContent = datos.activo_desde || "—";
        qr.style.opacity = "1";

      } catch (err) {
        estado.textContent = "FALLBACK";
        estado.className = "estado fallback";
        activo.textContent = "Sin conexión";
      }
    }
  </script>

</body>
</html>
