<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCXIMA</title>
  <!-- Librerías React para ejecutar directamente -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
import { useState, useEffect, useRef, useCallback } from "react";

// ── Design tokens ─────────────────────────────────────────────
const T = {
  bg:       "#08090D",
  surface:  "#0F1117",
  elevated: "#161920",
  border:   "rgba(255,255,255,0.06)",
  borderMd: "rgba(255,255,255,0.11)",
  accent:   "#4F7FFF",
  accentLo: "rgba(79,127,255,0.12)",
  accentMd: "rgba(79,127,255,0.25)",
  green:    "#34D17A",
  amber:    "#F0A429",
  red:      "#E8455A",
  text:     "#EDF0F5",
  sub:      "#6B7280",
  mono:     "'IBM Plex Mono', monospace",
  sans:     "'Sora', system-ui, sans-serif",
};

// ── Static data ───────────────────────────────────────────────
const ME = { id: "7F3A·C2B1·09DE", short: "7F3A", region: "Sector Norte" };

const PEERS = [
  { id: "A1B2", full: "A1B2·44EF·1209", rssi: -42, latency: 11,  hops: 1, status: "direct" },
  { id: "C3D4", full: "C3D4·BB01·3F7A", rssi: -68, latency: 44,  hops: 2, status: "relay"  },
  { id: "E5F6", full: "E5F6·09CC·8D21", rssi: -75, latency: 67,  hops: 2, status: "relay"  },
  { id: "G7H8", full: "G7H8·FA33·5501", rssi: -91, latency: 134, hops: 3, status: "weak"   },
];

const INIT_MSGS = [
  { id: 1, peer: "A1B2", text: "Nodo activo en sector norte.", ts: "14:31", mine: false },
  { id: 2, peer: "ME",   text: "Confirmado. Señal estable.", ts: "14:33", mine: true  },
  { id: 3, peer: "C3D4", text: "Ruta alternativa disponible vía relay E5F6.", ts: "14:35", mine: false, unread: true },
  { id: 4, peer: "G7H8", text: "Batería al 12 %. Buscando carga.", ts: "14:41", mine: false, unread: true },
];

// ── Helpers ───────────────────────────────────────────────────
function rssiToLabel(r) {
  if (r > -55) return { label: "Excelente", color: T.green };
  if (r > -70) return { label: "Buena",     color: T.green };
  if (r > -80) return { label: "Moderada",  color: T.amber };
  return             { label: "Débil",      color: T.red   };
}

function rssiToWidth(r) {
  return Math.max(8, Math.round(((r + 100) / 60) * 100));
}

// ── QR component (animated draw) ─────────────────────────────
function QR({ value, size = 148 }) {
  const ref = useRef();
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const N = 21; const cell = size / N;
    const hash = [...value].reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 0);
    const matrix = Array.from({ length: N }, (_, r) =>
      Array.from({ length: N }, (_, c) => {
        if (r < 7 && c < 7)       return (r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4)) ? 1 : 0;
        if (r < 7 && c > N - 8)   return (r===0||r===6||c===N-7||c===N-1||(r>=2&&r<=4&&c>=N-5&&c<=N-3)) ? 1 : 0;
        if (r > N - 8 && c < 7)   return (r===N-7||r===N-1||c===0||c===6||(r>=N-5&&r<=N-3&&c>=2&&c<=4)) ? 1 : 0;
        return (((hash >> ((r * N + c) % 29)) & 1) ^ ((r * c) % 3 === 0 ? 1 : 0));
      })
    );
    // draw each cell with a tiny delay for scan effect
    let i = 0; const cells = N * N;
    const draw = () => {
      if (i >= cells) return;
      const r = Math.floor(i / N), c = i % N;
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = T.surface;
      ctx.fillRect(0, 0, size, size);
      for (let rr = 0; rr <= r; rr++) {
        const maxC = rr < r ? N : c + 1;
        for (let cc = 0; cc < maxC; cc++) {
          ctx.fillStyle = matrix[rr][cc] ? T.text : "transparent";
          if (matrix[rr][cc]) ctx.fillRect(cc * cell + 1, rr * cell + 1, cell - 2, cell - 2);
        }
      }
      // scan line
      ctx.fillStyle = "rgba(79,127,255,0.15)";
      ctx.fillRect(0, r * cell, size, cell);
      i += N;
      setTimeout(draw, 14);
    };
    draw();
  }, [value, size]);
  return (
    <canvas ref={ref} width={size} height={size}
      style={{ borderRadius: 6, display: "block" }} />
  );
}

// ── Signal bars ───────────────────────────────────────────────
function SignalBars({ rssi }) {
  const filled = rssi > -55 ? 4 : rssi > -70 ? 3 : rssi > -80 ? 2 : 1;
  return (
    <div style={{ display: "flex", gap: 2, alignItems: "flex-end", height: 14 }}>
      {[4, 6, 9, 12].map((h, i) => (
        <div key={i} style={{
          width: 4, height: h,
          borderRadius: 1,
          background: i < filled
            ? (filled >= 3 ? T.green : filled === 2 ? T.amber : T.red)
            : T.elevated,
          transition: "background .3s",
        }} />
      ))}
    </div>
  );
}

// ── Map canvas ────────────────────────────────────────────────
const PEER_POS = [
  { x: 0.18, y: 0.28 }, { x: 0.78, y: 0.22 },
  { x: 0.82, y: 0.68 }, { x: 0.14, y: 0.74 },
];
function MapCanvas() {
  const ref = useRef();
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    ctx.fillStyle = T.bg; ctx.fillRect(0, 0, W, H);
    // grid
    ctx.strokeStyle = "rgba(255,255,255,0.04)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 32) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += 32) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    // roads
    ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 10; ctx.lineCap = "round";
    [[.1,.5,.9,.5],[.35,0,.35,1],[.68,.18,.68,.82],[0,.3,1,.65]].forEach(([x1,y1,x2,y2])=>{
      ctx.beginPath(); ctx.moveTo(x1*W,y1*H); ctx.lineTo(x2*W,y2*H); ctx.stroke();
    });
    // connections
    const cx = W*.5, cy = H*.5;
    PEERS.forEach((p, i) => {
      const { color } = rssiToLabel(p.rssi);
      const px = PEER_POS[i].x * W, py = PEER_POS[i].y * H;
      ctx.setLineDash([5, 6]); ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(79,127,255,0.2)";
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = T.sub; ctx.font = `10px ${T.mono}`;
      ctx.fillText(p.id, px + 9, py + 4);
    });
    // self
    ctx.shadowColor = T.accent; ctx.shadowBlur = 20;
    ctx.fillStyle = T.accent;
    ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff"; ctx.font = `bold 7px ${T.mono}`;
    ctx.textAlign = "center"; ctx.fillText("YO", cx, cy+2.5); ctx.textAlign = "left";
  }, []);
  return <canvas ref={ref} width={343} height={240} style={{ width: "100%", borderRadius: 10, display: "block" }} />;
}

// ── Screen: Nodo ──────────────────────────────────────────────
function ScreenNode() {
  const [tick, setTick] = useState(28);
  useEffect(() => {
    const t = setInterval(() => setTick(v => v <= 0 ? 30 : v - 1), 1000);
    return () => clearInterval(t);
  }, []);
  return (
    <div style={{ padding: "0 20px 24px" }}>
      {/* Node card */}
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
          <div>
            <div style={{ fontSize: 10, color: T.sub, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 6 }}>Identificador de nodo</div>
            <div style={{ fontFamily: T.mono, fontSize: 18, color: T.text, letterSpacing: "0.06em" }}>{ME.id}</div>
          </div>
          <div style={{ display: "flex", align: "center", gap: 6, background: T.accentLo, border: `1px solid ${T.accentMd}`, borderRadius: 20, padding: "4px 10px 4px 8px" }}>
            <div style={{ width: 6, height: 6, borderRadius: "50%", background: T.green, marginTop: 1 }} />
            <span style={{ fontSize: 11, color: T.accent, fontFamily: T.mono }}>EN LÍNEA</span>
          </div>
        </div>

        {/* Camera area */}
        <div style={{ background: T.elevated, borderRadius: 10, height: 160, marginBottom: 16, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10, border: `1px solid ${T.border}` }}>
          <div style={{ width: 48, height: 48, borderRadius: "50%", border: `1.5px solid ${T.accent}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.accent} strokeWidth="1.5">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <div style={{ fontSize: 12, color: T.sub }}>Vista de cámara en vivo</div>
          <div style={{ fontSize: 11, color: T.sub, fontFamily: T.mono }}>Requiere permiso de cámara</div>
        </div>

        {/* QR section */}
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <div style={{ flexShrink: 0, background: T.elevated, padding: 8, borderRadius: 10, border: `1px solid ${T.border}` }}>
            <QR value={ME.id} size={132} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 10, color: T.sub, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 8 }}>QR dinámico</div>
            <div style={{ fontSize: 12, color: T.sub, lineHeight: 1.6, marginBottom: 12 }}>
              Firmado con timestamp. Válido por:
            </div>
            <div style={{ fontFamily: T.mono, fontSize: 28, color: T.text, fontWeight: 300, letterSpacing: "-0.02em" }}>
              00:{tick.toString().padStart(2, "0")}
            </div>
            <div style={{ marginTop: 10, fontSize: 11, color: T.sub, fontFamily: T.mono }}>
              #{ME.short} · AES-256
            </div>
          </div>
        </div>
      </div>

      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {[["Uptime", "4h 23m"], ["Peers activos", "4"], ["Mensajes", "47"], ["Paquetes relay", "312"]].map(([k, v]) => (
          <div key={k} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 10, padding: "14px 16px" }}>
            <div style={{ fontSize: 10, color: T.sub, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 6 }}>{k}</div>
            <div style={{ fontFamily: T.mono, fontSize: 20, color: T.text, fontWeight: 300 }}>{v}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Screen: Mensajes ──────────────────────────────────────────
function ScreenMessages() {
  const [msgs, setMsgs] = useState(INIT_MSGS);
  const [text, setText] = useState("");
  const bottomRef = useRef();
  const send = () => {
    if (!text.trim()) return;
    const now = new Date();
    const ts = `${now.getHours().toString().padStart(2,"0")}:${now.getMinutes().toString().padStart(2,"0")}`;
    setMsgs(m => [...m, { id: Date.now(), peer: "ME", text: text.trim(), ts, mine: true }]);
    setText("");
    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: "smooth" }), 50);
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{ flex: 1, overflowY: "auto", padding: "4px 20px 12px" }}>
        {msgs.map((m, i) => {
          const showDate = i === 0 || msgs[i-1].peer !== m.peer;
          return (
            <div key={m.id}>
              {showDate && !m.mine && (
                <div style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, marginTop: 16, marginBottom: 4 }}>{m.peer}</div>
              )}
              <div style={{ display: "flex", justifyContent: m.mine ? "flex-end" : "flex-start", marginBottom: 4 }}>
                <div style={{
                  maxWidth: "75%", padding: "10px 14px",
                  borderRadius: m.mine ? "14px 14px 3px 14px" : "14px 14px 14px 3px",
                  background: m.mine ? T.accent : T.elevated,
                  border: `1px solid ${m.mine ? "transparent" : T.border}`,
                  fontSize: 14, color: m.mine ? "#fff" : T.text, lineHeight: 1.5,
                }}>{m.text}</div>
              </div>
              <div style={{ textAlign: m.mine ? "right" : "left", marginBottom: 10 }}>
                <span style={{ fontFamily: T.mono, fontSize: 10, color: T.sub }}>{m.ts}</span>
                {m.unread && <span style={{ marginLeft: 6, fontSize: 9, background: T.red, color: "#fff", padding: "1px 5px", borderRadius: 10 }}>nuevo</span>}
              </div>
            </div>
          );
        })}
        <div ref={bottomRef} />
      </div>
      <div style={{ padding: "12px 20px 20px", borderTop: `1px solid ${T.border}`, display: "flex", gap: 10 }}>
        <input
          value={text} onChange={e => setText(e.target.value)}
          onKeyDown={e => e.key === "Enter" && send()}
          placeholder="Mensaje cifrado…"
          style={{
            flex: 1, background: T.elevated, border: `1px solid ${T.borderMd}`,
            borderRadius: 24, padding: "11px 18px", color: T.text, fontSize: 14,
            outline: "none", fontFamily: T.sans,
          }}
        />
        <button onClick={send} style={{
          width: 44, height: 44, borderRadius: "50%", background: T.accent,
          border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
        }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

// ── Screen: Red / Peers ───────────────────────────────────────
function ScreenPeers() {
  return (
    <div style={{ padding: "0 20px 24px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontSize: 12, color: T.sub }}>4 nodos en rango</span>
        <div style={{ fontFamily: T.mono, fontSize: 11, color: T.accent, background: T.accentLo, padding: "3px 10px", borderRadius: 20 }}>MeshBLE v2</div>
      </div>
      {PEERS.map((p, i) => {
        const sig = rssiToLabel(p.rssi);
        return (
          <div key={p.id} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: "16px 18px", marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ fontFamily: T.mono, fontSize: 15, color: T.text, letterSpacing: "0.05em" }}>{p.full}</div>
              <SignalBars rssi={p.rssi} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
              {[
                ["RSSI", `${p.rssi} dBm`],
                ["Latencia", `${p.latency} ms`],
                ["Saltos", String(p.hops)],
                ["Estado", p.status],
              ].map(([k, v]) => (
                <div key={k}>
                  <div style={{ fontSize: 9, color: T.sub, letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 3 }}>{k}</div>
                  <div style={{ fontFamily: T.mono, fontSize: 12, color: k === "Estado" ? (p.status === "direct" ? T.green : p.status === "relay" ? T.accent : T.amber) : T.text }}>{v}</div>
                </div>
              ))}
            </div>
            {/* Signal bar */}
            <div style={{ marginTop: 14, height: 2, background: T.elevated, borderRadius: 1 }}>
              <div style={{ height: "100%", width: `${rssiToWidth(p.rssi)}%`, background: sig.color, borderRadius: 1, transition: "width .6s ease" }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Screen: Ubicación ─────────────────────────────────────────
function ScreenMap() {
  return (
    <div style={{ padding: "0 20px 24px" }}>
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: "hidden", marginBottom: 16 }}>
        <MapCanvas />
        <div style={{ padding: "12px 16px", display: "flex", gap: 16, borderTop: `1px solid ${T.border}` }}>
          {[{ c: T.green, l: "Directo" }, { c: T.accent, l: "Tú" }, { c: T.amber, l: "Relay" }, { c: T.red, l: "Débil" }].map(({ c, l }) => (
            <div key={l} style={{ display: "flex", alignItems: "center", gap: 5 }}>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: c }} />
              <span style={{ fontSize: 11, color: T.sub }}>{l}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ fontSize: 10, color: T.sub, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 10 }}>Peers en rango</div>
      {PEERS.map((p, i) => {
        const { color, label } = rssiToLabel(p.rssi);
        return (
          <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 0", borderBottom: `1px solid ${T.border}` }}>
            <div style={{ width: 7, height: 7, borderRadius: "50%", background: color, flexShrink: 0 }} />
            <div style={{ fontFamily: T.mono, fontSize: 13, color: T.accent, width: 36 }}>{p.id}</div>
            <div style={{ flex: 1 }}>
              <div style={{ height: 2, background: T.elevated, borderRadius: 1 }}>
                <div style={{ height: "100%", width: `${rssiToWidth(p.rssi)}%`, background: color, borderRadius: 1 }} />
              </div>
            </div>
            <div style={{ fontFamily: T.mono, fontSize: 11, color: T.sub, width: 60, textAlign: "right" }}>{p.rssi} dBm</div>
          </div>
        );
      })}
    </div>
  );
}

// ── Screen: Config ────────────────────────────────────────────
function ScreenConfig() {
  const [s, setS] = useState({ relay: true, e2e: true, discovery: false, battery: false });
  const toggle = k => setS(v => ({ ...v, [k]: !v[k] }));
  const rows = [
    { k: "relay",     label: "Reenviar paquetes",    desc: "Este nodo actúa como relay para la red" },
    { k: "e2e",       label: "Cifrado extremo a extremo", desc: "AES-256 · todos los mensajes" },
    { k: "discovery", label: "Descubrimiento público", desc: "Visible para nuevos nodos en rango" },
    { k: "battery",   label: "Modo bajo consumo",    desc: "Reduce frecuencia de ping a 10 s" },
  ];
  return (
    <div style={{ padding: "0 20px 24px" }}>
      <div style={{ fontSize: 10, color: T.sub, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 12 }}>Comportamiento del nodo</div>
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: "hidden", marginBottom: 20 }}>
        {rows.map(({ k, label, desc }, i) => (
          <div key={k} style={{
            display: "flex", alignItems: "center", padding: "16px 18px", gap: 14,
            borderBottom: i < rows.length - 1 ? `1px solid ${T.border}` : "none",
          }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, color: T.text, fontWeight: 500, marginBottom: 2 }}>{label}</div>
              <div style={{ fontSize: 12, color: T.sub }}>{desc}</div>
            </div>
            <div onClick={() => toggle(k)} style={{
              width: 46, height: 26, borderRadius: 13, cursor: "pointer", flexShrink: 0,
              background: s[k] ? T.accent : T.elevated,
              border: `1px solid ${s[k] ? T.accent : T.borderMd}`,
              position: "relative", transition: "background .2s",
            }}>
              <div style={{
                position: "absolute", top: 4, left: s[k] ? 22 : 4,
                width: 16, height: 16, borderRadius: "50%",
                background: s[k] ? "#fff" : T.sub,
                transition: "left .2s",
              }} />
            </div>
          </div>
        ))}
      </div>

      <div style={{ fontSize: 10, color: T.sub, letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 12 }}>Parámetros de red</div>
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: "hidden" }}>
        {[["Puerto", "7831"], ["Protocolo", "MeshBLE v2"], ["Canal", "BLE 37–39"], ["Versión", "0.9.4-beta"]].map(([k, v], i, a) => (
          <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 18px", borderBottom: i < a.length - 1 ? `1px solid ${T.border}` : "none" }}>
            <span style={{ fontSize: 13, color: T.sub }}>{k}</span>
            <span style={{ fontFamily: T.mono, fontSize: 13, color: T.text }}>{v}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── App shell ─────────────────────────────────────────────────
const TABS = [
  { id: "node",     label: "Nodo",      icon: (a) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?"#4F7FFF":"#6B7280"} strokeWidth="1.8">
      <circle cx="12" cy="12" r="3"/><path d="M6.3 17.7a8 8 0 1 1 11.4 0"/>
      <path d="M3.1 20.9a12 12 0 1 1 17.8 0"/>
    </svg>)
  },
  { id: "messages", label: "Mensajes",  icon: (a) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?"#4F7FFF":"#6B7280"} strokeWidth="1.8">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>)
  },
  { id: "peers",    label: "Red",       icon: (a) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?"#4F7FFF":"#6B7280"} strokeWidth="1.8">
      <circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
      <path d="M12 7v3m-5.2 7.2L10 14m4 0 3.2 3.2"/>
    </svg>)
  },
  { id: "map",      label: "Ubicación", icon: (a) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?"#4F7FFF":"#6B7280"} strokeWidth="1.8">
      <polygon points="3 11 22 2 13 21 11 13 3 11"/>
    </svg>)
  },
  { id: "config",   label: "Ajustes",   icon: (a) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={a?"#4F7FFF":"#6B7280"} strokeWidth="1.8">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>)
  },
];

function App() {
  const [tab, setTab] = useState("node");
  const unread = INIT_MSGS.filter(m => m.unread).length;
  const screens = { node: <ScreenNode />, messages: <ScreenMessages />, peers: <ScreenPeers />, map: <ScreenMap />, config: <ScreenConfig /> };

  return (
    <div style={{ minHeight: "100vh", background: "#04050A", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: T.sans }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        input { font-family: inherit; }
        input::placeholder { color: ${T.sub}; }
      `}</style>

      {/* Phone frame */}
      <div style={{
        width: 390, height: 844,
        background: T.bg, borderRadius: 44,
        overflow: "hidden", display: "flex", flexDirection: "column",
        boxShadow: "0 0 0 10px #111118, 0 0 0 11px #1a1b22, 0 40px 80px rgba(0,0,0,.8)",
      }}>

        {/* Status bar */}
        <div style={{ padding: "16px 28px 0", display: "flex", justifyContent: "space-between", alignItems: "center", flexShrink: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
            <div style={{ width: 7, height: 7, borderRadius: "50%", background: T.green }} />
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.sub }}>{ME.short} · {ME.region}</span>
          </div>
          <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
            <SignalBars rssi={-42} />
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.sub, marginLeft: 4 }}>9:41</span>
          </div>
        </div>

        {/* Page title */}
        <div style={{ padding: "14px 24px 0", flexShrink: 0 }}>
          <h1 style={{ fontSize: 26, fontWeight: 600, color: T.text, letterSpacing: "-0.02em" }}>
            {TABS.find(t => t.id === tab)?.label}
          </h1>
        </div>

        {/* Content */}
        <div style={{ flex: 1, overflowY: "auto", paddingTop: 20 }}>
          {screens[tab]}
        </div>

        {/* Bottom nav */}
        <div style={{ flexShrink: 0, background: T.surface, borderTop: `1px solid ${T.border}`, paddingBottom: 20 }}>
          <div style={{ display: "flex" }}>
            {TABS.map(t => {
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{
                  flex: 1, background: "none", border: "none", cursor: "pointer",
                  padding: "12px 0 6px", display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 4, position: "relative",
                }}>
                  {t.icon(active)}
                  <span style={{ fontSize: 10, color: active ? T.accent : T.sub, fontWeight: active ? 600 : 400, transition: "color .15s" }}>
                    {t.label}
                  </span>
                  {/* Active dot */}
                  {active && <div style={{ position: "absolute", bottom: 0, left: "50%", transform: "translateX(-50%)", width: 4, height: 4, borderRadius: "50%", background: T.accent }} />}
                  {/* Unread badge */}
                  {t.id === "messages" && unread > 0 && (
                    <div style={{ position: "absolute", top: 8, left: "calc(50% + 4px)", background: T.red, width: 14, height: 14, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <span style={{ fontSize: 8, color: "#fff", fontWeight: 700 }}>{unread}</span>
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
