<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCXIMA QR</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #08090D; display: grid; place-items: center; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
const { useRef, useEffect } = React;
const QR_LINK = "https://eveliollo.github.io/SOCXIMA-OFICIAL/";

function CodigoQR({ valor = QR_LINK, tamaño = 240 }) {
  const lienzo = useRef(null);
  useEffect(() => {
    const canvas = lienzo.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const N = 21;
    const celda = tamaño / N;
    const hash = [...valor].reduce((acum, letra) => (acum * 911 + letra.charCodeAt(0)) & 0xFFFFFF, 0);
    const matriz = Array.from({ length: N }, (_, fila) =>
      Array.from({ length: N }, (_, col) => {
        if ((fila < 7 && col < 7) || (fila < 7 && col > N - 8) || (fila > N - 8 && col < 7)) {
          return (fila === 0 || fila === 6 || col === 0 || col === 6 || (fila >= 2 && fila <= 4 && col >= 2 && col <= 4)) ? 1 : 0;
        }
        return ((hash >> ((fila * N + col) % 28)) & 1) ^ ((fila + col) % 2);
      })
    );
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, tamaño, tamaño);
    for (let f = 0; f < N; f++) {
      for (let c = 0; c < N; c++) {
        ctx.fillStyle = matriz[f][c] ? "#000000" : "#ffffff";
        ctx.fillRect(c * celda + 1, f * celda + 1, celda - 2, celda - 2);
      }
    }
  }, [valor, tamaño]);
  return (
    <div style={{ background: "#fff", padding: 12, borderRadius: 12, border: "2px solid #4F7FFF" }}>
      <canvas ref={lienzo} width={tamaño} height={tamaño} />
    </div>
  );
}

function App() {
  return <CodigoQR />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
