<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SOCXIMA · Red Descentralizada</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #04060F;
      --s1:      #0A0E1C;
      --s2:      #0F1525;
      --border:  #1A2438;
      --green:   #7FFF9E;
      --blue:    #4DAAFF;
      --text:    #E0E6F0;
      --muted:   #3A4D6A;
      --dimmed:  #8A9AB8;
      --danger:  #FF5C72;
      --amber:   #FFB347;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .wordmark {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 0.14em;
      color: #fff;
    }

    .node-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      padding: 0.3rem 0.65rem;
      border-radius: 100px;
      border: 1px solid rgba(127,255,158,0.25);
      color: var(--green);
      background: rgba(127,255,158,0.05);
      transition: color 0.3s, border-color 0.3s;
    }
    .node-badge.offline { color: var(--danger); border-color: rgba(255,92,114,0.25); }

    .ndot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll::-webkit-scrollbar { display: none; }

    .screen { display: none; flex-direction: column; min-height: 100%; }
    .screen.active { display: flex; }

    .s-nodo {
      padding: 1.5rem 1.25rem 2rem;
      align-items: center;
      gap: 0;
    }

    .nodo-title {
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      align-self: flex-start;
    }

    .qr-hero {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .corner {
      position: absolute;
      width: 20px; height: 20px;
      z-index: 2;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--green);
      transition: background 0.4s;
    }
    .corner::before { width: 100%; height: 2px; top: 0; left: 0; }
    .corner::after  { width: 2px; height: 100%; top: 0; left: 0; }

    .corner.tl { top: -5px; left: -5px; }
    .corner.tr { top: -5px; right: -5px; }
    .corner.tr::before { left: auto; right: 0; }
    .corner.tr::after  { left: auto; right: 0; }
    .corner.bl { bottom: -5px; left: -5px; }
    .corner.bl::before { top: auto; bottom: 0; }
    .corner.br { bottom: -5px; right: -5px; }
    .corner.br::before { top: auto; bottom: 0; left: auto; right: 0; }
    .corner.br::after  { left: auto; right: 0; }

    .offline-frame .corner::before,
    .offline-frame .corner::after { background: var(--danger); }

    .qr-box {
      background: #F4F4EE;
      border-radius: 6px;
      padding: 1rem;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #222;
      text-align: center;
    }

    .scan-hint {
      font-size: 0.62rem;
      color: var(--dimmed);
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
    }

    .conn-pill {
      width: 100%;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-size: 0.62rem;
      color: var(--green);
      word-break: break-all;
      cursor: pointer;
      text-align: center;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    .conn-pill:hover { border-color: var(--green); }

    .copy-flash {
      font-size: 0.55rem;
      color: var(--green);
      text-align: center;
      height: 1rem;
      letter-spacing: 0.12em;
      opacity: 0;
      transition: opacity 0.25s;
      margin-bottom: 1rem;
    }
    .copy-flash.show { opacity: 1; }

    .tech-toggle {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--muted);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      transition: color 0.2s, border-color 0.2s;
    }
    .tech-toggle:hover { border-color: var(--green); color: var(--text); }
    .tech-arrow { transition: transform 0.3s; }
    .tech-toggle.open .tech-arrow { transform: rotate(180deg); }

    .tech-body {
      width: 100%;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease;
    }
    .tech-body.open { max-height: 300px; }

    .tech-inner {
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .meta-row { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 1rem; }
    .mk { font-size: 0.58rem; color: var(--muted); white-space: nowrap; }
    .mv { font-size: 0.68rem; color: var(--text); word-break: break-all; }

    .srv-row { display: flex; gap: 0.5rem; }
    .srv-input {
      flex: 1; min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      color: var(--text);
      font-size: 0.62rem;
      outline: none;
    }
    .srv-input:focus { border-color: var(--green); }
    .srv-btn {
      background: none;
      border: 1px solid var(--green);
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      color: var(--green);
      font-size: 0.6rem;
      cursor: pointer;
      letter-spacing: 0.08em;
    }
    .srv-btn:hover { background: rgba(127,255,158,0.07); }

    .navbar {
      flex-shrink: 0;
      display: flex;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0.5rem);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 0.25rem 0.5rem;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--muted);
      font-size: 0.52rem;
      letter-spacing: 0.08em;
      gap: 0.3rem;
      transition: color 0.2s;
      position: relative;
    }
    .nav-item.active { color: var(--green); }
    .nav-item::before {
      content: '';
      position: absolute;
      top: 0; left: 25%; right: 25%;
      height: 2px;
      background: var(--green);
      border-radius: 0 0 2px 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .nav-item.active::before { opacity: 1; }

    .nav-icon { font-size: 1.1rem; line-height: 1; }
  </style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <span class="wordmark">SOCXIMA</span>
    <div class="node-badge offline" id="node-badge">
      <span class="ndot"></span>
      <span id="node-status">FALLBACK</span>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div class="screen s-nodo active" id="screen-nodo">
      <span class="nodo-title">TU NODO ACTIVO</span>

      <div class="qr-hero offline-frame" id="qr-hero">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="qr-box" id="qr-box">
          Conecta primero<br>para ver QR
        </div>
      </div>

      <p class="scan-hint">Escanea para unirte a este nodo</p>

      <div class="conn-pill" id="conn-pill" onclick="copiarConn()">
        socxima://connect?node=SOCXIMA-V3-ALPHA-88
      </div>
      <div class="copy-flash" id="copy-flash">✓ COPIADO</div>

      <button class="tech-toggle" id="tech-btn" onclick="toggleTech()">
        <span>DETALLES DEL NODO</span>
        <span class="tech-arrow">▾</span>
      </button>
      <div class="tech-body" id="tech-body">
        <div class="tech-inner">
          <div class="meta-row">
            <span class="mk">ID</span><span class="mv" id="id-nodo">RedSOCXIMA-V3-ALPHA-88</span>
            <span class="mk">Firmware</span><span class="mv" id="firmware">3.5.2-LTS-MESH</span>
            <span class="mk">Activo desde</span><span class="mv" id="actividad">—</span>
          </div>
          <div class="srv-row">
            <input type="text" class="srv-input" id="url-api" value="http://192.168.1.3:8080/estado" spellcheck="false">
            <button class="srv-btn" onclick="sincronizar()">SYNC</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="navbar">
    <button class="nav-item active" id="nav-nodo" onclick="navTo('nodo')">
      <span class="nav-icon">⬡</span>NODO
    </button>
    <button class="nav-item" id="nav-msg" onclick="navTo('msg')">
      <span class="nav-icon">💬</span>MENSAJES
    </button>
    <button class="nav-item" id="nav-ubi" onclick="navTo('ubi')">
      <span class="nav-icon">◎</span>UBICACIÓN
    </button>
    <button class="nav-item" id="nav-red" onclick="navTo('red')">
      <span class="nav-icon">⟁</span>RED
    </button>
  </nav>

</div>

<script>
  function navTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-'+id).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('nav-'+id).classList.add('active');
    document.getElementById('scroll').scrollTop = 0;
  }

  async function sincronizar() {
    const url = document.getElementById('url-api').value.trim();
    const estado = document.getElementById('node-status');
    const badge = document.getElementById('node-badge');
    const qrHero = document.getElementById('qr-hero');
    const idNodo = document.getElementById('id-nodo');
    const version = document.getElementById('firmware');
    const activo = document.getElementById('actividad');
    const enlace = document.getElementById('conn-pill');

    estado.textContent = "CONECTANDO";
    badge.classList.remove('offline');
    qrHero.classList.add('offline-frame');

    try {
      const res = await fetch(url, {
        method: 'GET',
        mode: 'cors',
        cache: 'no-cache',
        signal: AbortSignal.timeout(6000)
      });
      if (!res.ok) throw new Error("Sin respuesta");
      const datos = await res.json();

      estado.textContent = "ONLINE";
      badge.classList.remove('offline');
      qrHero.classList.remove('offline-frame');
      idNodo.textContent = datos.id || "SOCXIMA-V3";
      version.textContent = datos.version || "3.5.2-LTS-MESH";
      activo.textContent = datos.activo_desde || "—";
      enlace.textContent = `https://eveliollo.github.io/SOCXIMA-OFICIAL/?nodo=${url}`;
      document.getElementById('qr-box').textContent = "✅ CONECTADO";

    } catch (err) {
      estado.textContent = "FALLBACK";
      badge.classList.add('offline');
      qrHero.classList.add('offline-frame');
      document.getElementById('qr-box').textContent = "❌ Sin conexión";
    }
  }

  function toggleTech() {
    document.getElementById('tech-btn').classList.toggle('open');
    document.getElementById('tech-body').classList.toggle('open');
  }

  function copiarConn() {
    const texto = document.getElementById('conn-pill').textContent.trim();
    navigator.clipboard.writeText(texto).catch(()=>{});
    const aviso = document.getElementById('copy-flash');
    aviso.classList.add('show');
    setTimeout(() => aviso.classList.remove('show'), 1500);
  }
</script>
</body>
</html>
