<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCXIMA - Sincronización de Nodo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #000; color: #e0e0e0; padding: 2.5rem 1.5rem; max-width: 500px; margin: 0 auto; }
        .titulo { text-align: center; margin-bottom: 2.5rem; }
        h1 { color: #22c55e; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .subtitulo { color: #a0a0a0; font-size: 1rem; }
        .caja { background: #12151f; border-radius: 10px; padding: 1.8rem; border: 1px solid #222838; }
        label { display: block; margin-bottom: 0.8rem; font-weight: 500; color: #d0d0d0; font-size: 0.95rem; }
        input { width: 100%; padding: 1rem; border: 2px solid #2a3042; border-radius: 8px; background: #0b0e18; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #22c55e; }
        button { width: 100%; padding: 1.1rem; margin-top: 1.5rem; background: #22c55e; color: #000; border: none; border-radius: 8px; font-size: 1.15rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1da84a; }
        #mensaje { margin-top: 1.2rem; padding: 0.9rem; border-radius: 6px; text-align: center; font-weight: 500; }
        .error { background: #2c141a; color: #ff6b72; border-left: 4px solid #e53e3e; }
        .ok { background: #14231c; color: #86efac; border-left: 4px solid #22c55e; }
        .cargando { background: #222014; color: #fcd34d; border-left: 4px solid #eab308; }
    </style>
</head>
<body>
    <div class="titulo">
        <h1>SOCXIMA</h1>
        <p class="subtitulo">Sistema de Conexión de Nodos</p>
    </div>

    <div class="caja">
        <label>DIRECCIÓN IP DEL NODO</label>
        <input type="text" id="direccion" placeholder="Ej: http://192.168.1.3:8080/estado">
        <button id="btnSincro">SINCRONIZAR NODO</button>
        <div id="mensaje"></div>
    </div>

    <script>
        const campoDir = document.getElementById('direccion');
        const boton = document.getElementById('btnSincro');
        const cajaMensaje = document.getElementById('mensaje');

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const nodo = params.get('nodo');
            if (nodo) campoDir.value = nodo;
        });

        boton.addEventListener('click', async () => {
            const url = campoDir.value.trim();
            cajaMensaje.className = '';
            cajaMensaje.textContent = '';

            if (!url) {
                cajaMensaje.textContent = "❌ Escribe una dirección válida";
                cajaMensaje.className = "error";
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                cajaMensaje.textContent = "❌ Debe empezar con http://";
                cajaMensaje.className = "error";
                return;
            }

            cajaMensaje.textContent = "🔄 Conectando al nodo...";
            cajaMensaje.className = "cargando";
            boton.disabled = true;

            try {
                const respuesta = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache',
                    headers: { 'Accept': 'application/json' }
                });

                if (!respuesta.ok) throw new Error("Sin respuesta. Revisa el motor y la red.");

                const datos = await respuesta.json();
                cajaMensaje.innerHTML = `✅ CONECTADO<br>
                ID: ${datos.id}<br>
                Versión: ${datos.version}<br>
                Activo desde: ${datos.activo_desde}`;
                cajaMensaje.className = "ok";

            } catch (error) {
                cajaMensaje.textContent = `❌ Error: ${error.message}`;
                cajaMensaje.className = "error";
            }

            boton.disabled = false;
        });
    </script>
</body>
</html>
