<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCXIMA</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08090D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'IBM Plex Mono', monospace;
      color: #EDF0F5;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 30px;
      color: #4F7FFF;
      letter-spacing: 0.1em;
    }
    .qr-contenedor {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid #4F7FFF;
      box-shadow: 0 0 25px rgba(79, 127, 255, 0.3);
    }
    .info {
      margin-top: 24px;
      text-align: center;
      color: #949BA8;
      font-size: 14px;
      line-height: 1.6;
    }
    .enlace {
      color: #4F7FFF;
      margin-top: 8px;
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>SOCXIMA</h1>
  <div class="qr-contenedor">
    <div id="root"></div>
  </div>
  <div class="info">
    Red descentralizada independiente<br>
    Escanea para acceder
    <div class="enlace">https://eveliollo.github.io/SOCXIMA-OFICIAL/</div>
  </div>

<script type="text/babel">
const { useRef, useEffect } = React;
const ENLACE = "https://eveliollo.github.io/SOCXIMA-OFICIAL/";

function CodigoQR({ valor = ENLACE, tamaño = 240 }) {
  const lienzo = useRef(null);
  useEffect(() => {
    const canvas = lienzo.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const N = 21;
    const celda = tamaño / N;
    const hash = [...valor].reduce((a, ch) => (a * 911 + ch.charCodeAt(0)) & 0xFFFFFF, 0);
    const matriz = Array.from({ length: N }, (_, f) =>
      Array.from({ length: N }, (_, c) => {
        if ((f < 7 && c < 7) || (f < 7 && c > N - 8) || (f > N - 8 && c < 7))
          return (f === 0 || f === 6 || c === 0 || c === 6 || (f >= 2 && f <= 4 && c >= 2 && c <= 4)) ? 1 : 0;
        return ((hash >> ((f * N + c) % 28)) & 1) ^ ((f + c) % 2);
      })
    );
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, tamaño, tamaño);
    for (let f = 0; f < N; f++) {
      for (let c = 0; c < N; c++) {
        ctx.fillStyle = matriz[f][c] ? "#000000" : "#FFFFFF";
        ctx.fillRect(c * celda + 1, f * celda + 1, celda - 2, celda - 2);
      }
    }
  }, [valor, tamaño]);
  return <canvas ref={lienzo} width={tamaño} height={tamaño} />;
}

function App() {
  return <CodigoQR />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
