<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCXIMA | Node Control</title>
    <style>
        :root {
            --primary: #22c55e;
            --bg: #0a0a12;
            --card: #0f172a;
            --text: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; }
        
        .header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--primary); font-size: 2rem; letter-spacing: -1px; margin-bottom: 0.5rem; }
        
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .campo { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 0.8rem; background: #050508; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 1rem; }
        
        button { width: 100%; padding: 1rem; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        button:active { transform: scale(0.98); }
        
        #estado { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; background: #050508; border-left: 4px solid #475569; font-size: 0.95rem; }
        .online { color: #22c55e; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SOCXIMA</h1>
            <p>Sistema de Conexión de Nodos</p>
        </div>

        <div class="card">
            <div class="campo">
                <label>Dirección IP del Nodo</label>
                <input type="text" id="direccion" placeholder="http://192.168.1.XX:8080/estado">
            </div>
            <button id="btnSync">SINCRONIZAR NODO</button>
            <div id="estado">Esperando conexión...</div>
        </div>
    </div>

    <script>
        const campoDir = document.getElementById('direccion');
        const boton = document.getElementById('btnSync');
        const estado = document.getElementById('estado');

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const nodo = params.get('nodo');
            if (nodo) campoDir.value = nodo;
        });

        boton.addEventListener('click', async () => {
            const url = campoDir.value.trim();
            if (!url) return estado.textContent = "❌ Escribe una IP válida";

            estado.textContent = "🔄 Sincronizando...";
            boton.style.opacity = "0.5";
            boton.disabled = true;

            try {
                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) throw new Error("Nodo inaccesible");
                const d = await res.json();
                
                estado.innerHTML = `<span class="online">✅ Conectado</span><br>
                    <strong>ID:</strong> ${d.id}<br>
                    <strong>Versión:</strong> ${d.version}<br>
                    <strong>Estado:</strong> ${d.estado}`;
                estado.style.borderLeftColor = "#22c55e";
            } catch (err) {
                estado.innerHTML = `<span class="error">❌ Error: ${err.message}</span>`;
                estado.style.borderLeftColor = "#ef4444";
            }
            boton.style.opacity = "1";
            boton.disabled = false;
        });
    </script>
</body>
</html>
