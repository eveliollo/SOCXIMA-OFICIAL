    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #04060F;
      --surface:  #0D1120;
      --border:   #1C2640;
      --green:    #7FFF9E;
      --text:     #E8EAF0;
      --muted:    #3E4F6E;
      --white:    #F4F4EE;
      --danger:   #FF5C72;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #1C2640 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.45;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }

    .wordmark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      color: var(--white);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      color: var(--green);
      transition: color 0.4s;
    }
    .live-badge.offline { color: var(--danger); }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.7); }
    }

    .qr-hero {
      position: relative;
      margin-bottom: 2rem;
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      z-index: 2;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--green);
      transition: background 0.4s;
    }
    .corner::before { width: 100%; height: 2px; }
    .corner::after  { width: 2px; height: 100%; }

    .corner.tl { top: -6px;  left: -6px;  }
    .corner.tr { top: -6px;  right: -6px; }
    .corner.bl { bottom: -6px; left: -6px; }
    .corner.br { bottom: -6px; right: -6px; }

    .corner.tr::before { right: 0; }
    .corner.tr::after  { right: 0; }
    .corner.bl::before { bottom: 0; }
    .corner.bl::after  { bottom: 0; }
    .corner.br::before { right: 0; bottom: 0; }
    .corner.br::after  { right: 0; bottom: 0; }

    .corner::before, .corner::after {
      animation: corner-draw 0.6s cubic-bezier(0.4,0,0.2,1) both;
    }
    .corner.tl::before { transform-origin: left;   animation-delay: 0.1s; }
    .corner.tl::after  { transform-origin: top;    animation-delay: 0.2s; }
    .corner.tr::before { transform-origin: right;  animation-delay: 0.25s; }
    .corner.tr::after  { transform-origin: top;    animation-delay: 0.35s; }
    .corner.bl::before { transform-origin: left;   animation-delay: 0.4s; }
    .corner.bl::after  { transform-origin: bottom; animation-delay: 0.5s; }
    .corner.br::before { transform-origin: right;  animation-delay: 0.55s; }
    .corner.br::after  { transform-origin: bottom; animation-delay: 0.65s; }

    @keyframes corner-draw {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    .corner::after {
      animation-name: corner-draw-v;
    }
    @keyframes corner-draw-v {
      from { transform: scaleY(0); opacity: 0; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    .qr-box {
      background: var(--white);
      border-radius: 4px;
      padding: 1.25rem;
      display: block;
    }

    .offline-corners .corner::before,
    .offline-corners .corner::after {
      background: var(--danger);
    }

    .scan-label {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    .conn-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 2.5rem;
    }

    .conn-string {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 3.5rem 0.9rem 1rem;
      font-size: 0.65rem;
      color: var(--green);
      word-break: break-all;
      cursor: pointer;
      transition: border-color 0.2s;
      line-height: 1.6;
    }
    .conn-string:hover { border-color: var(--green); }

    .copy-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1rem;
      transition: color 0.2s;
      padding: 0.25rem;
    }
    .copy-btn:hover { color: var(--green); }

    .copy-toast {
      position: absolute;
      bottom: -1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: var(--green);
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
    .copy-toast.show { opacity: 1; }

    .tech-toggle {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s, color 0.2s;
      text-transform: uppercase;
      margin-bottom: 0;
    }
    .tech-toggle:hover { border-color: var(--green); color: var(--text); }

    .toggle-arrow {
      transition: transform 0.3s;
    }
    .tech-toggle.open .toggle-arrow { transform: rotate(180deg); }

    .tech-panel {
      width: 100%;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .tech-panel.open { max-height: 400px; }

      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
