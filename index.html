<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOCXIMA · Nodo Activo</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    :root {
      --bg: #04060F;
      --surface: #0D1120;
      --border: #1C2640;
      --green: #7FFF9E;
      --red: #FF5C72;
      --text: #E8EAF0;
      --muted: #6B7899;
      --white: #F4F4EE;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.4;
      z-index: 0;
    }
    .wrap {
      width: 100%;
      max-width: 420px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--white);
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--red);
    }
    .status.on { color: var(--green); }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .qr-outer {
      position: relative;
      margin: 0 auto;
    }
    .qr-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid var(--red);
    }
    .status.on ~ .qr-corner { border-color: var(--green); }
    .qr-corner.tl { top: -8px; left: -8px; border-right: none; border-bottom: none; }
    .qr-corner.tr { top: -8px; right: -8px; border-left: none; border-bottom: none; }
    .qr-corner.bl { bottom: -8px; left: -8px; border-right: none; border-top: none; }
    .qr-corner.br { bottom: -8px; right: -8px; border-left: none; border-top: none; }

    .qr-box {
      background: var(--white);
      padding: 1.2rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrcode { width: 240px; height: 240px; }

    .scan-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1rem;
    }

    .link-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      color: var(--green);
      font-size: 0.8rem;
      word-break: break-all;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .copy-btn:hover { color: var(--green); }

    .toggle {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .toggle:hover { border-color: var(--green); color: var(--text); }

    .panel {
      width: 100%;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 1.2rem;
      display: none;
      flex-direction: column;
      gap: 1rem;
      font-size: 0.8rem;
    }
    .row {
      display: flex;
      justify-content: space-between;
    }
    .label { color: var(--muted); }
    .value { color: var(--text); font-weight: 500; }
    .row-api {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem;
      color: var(--text);
      font-size: 0.8rem;
    }
    .sync-btn {
      background: var(--green);
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      color: var(--bg);
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="header">
      <div class="title">SOCXIMA</div>
      <div class="status" id="status">
        <div class="dot"></div>
        <span>FALLBACK</span>
      </div>
    </div>

    <div class="qr-outer">
      <div class="qr-corner tl"></div>
      <div class="qr-corner tr"></div>
      <div class="qr-corner bl"></div>
      <div class="qr-corner br"></div>
      <div class="qr-box">
        <canvas id="qrcode" width="240" height="240"></canvas>
      </div>
    </div>
    <p class="scan-text">Escanea para conectarte</p>

    <div class="link-box" id="link">
      socxima://connect?node=SOCXIMA-V3
      <button class="copy-btn" onclick="copyLink()">⧉</button>
    </div>

    <button class="toggle" onclick="togglePanel()">
      Detalles del nodo <span>▼</span>
    </button>

    <div class="panel" id="panel">
      <div class="row">
        <span class="label">ID Nodo:</span>
        <span class="value" id="node-id">---</span>
      </div>
      <div class="row">
        <span class="label">Versión:</span>
        <span class="value">3.5.2-LTS-MESH</span>
      </div>
      <div class="row">
        <span class="label">Activo desde:</span>
        <span class="value" id="since">---</span>
      </div>
      <div class="row-api">
        <input type="text" id="api-url" value="http://127.0.0.1:8080/estado">
        <button class="sync-btn" onclick="syncNode()">SYNC</button>
      </div>
    </div>
  </div>

<script>
/* Implementación completa de QR Code dentro del archivo */
function generateQR(text, size = 240) {
  const canvas = document.getElementById('qrcode');
  const ctx = canvas.getContext('2d');
  const qr = new QRCodeImpl();
  qr.addData(text);
  qr.make();
  const modules = qr.modules;
  const cellSize = size / (modules.length + 8);
  const padding = 4 * cellSize;
  ctx.fillStyle = '#F4F4EE';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#04060F';
  for (let y = 0; y < modules.length; y++) {
    for (let x = 0; x < modules.length; x++) {
      if (modules[y][x]) {
        ctx.fillRect(padding + x * cellSize, padding + y * cellSize, cellSize, cellSize);
      }
    }
  }
}

class QRCodeImpl {
  constructor() {
    this.modules = [];
    this.size = 0;
    this.data = '';
  }
  addData(text) { this.data = encodeURIComponent(text); }
  make() {
    const len = this.data.length;
    const ver = len < 20 ? 3 : 5;
    this.size = 21 + (ver - 1) * 4;
    this.modules = Array(this.size).fill().map(() => Array(this.size).fill(false));
    this._addPositionPatterns();
    const bits = this._encodeData();
    this._placeBits(bits);
  }
  _addPositionPatterns() {
    const addPattern = (x, y) => {
      for (let dy = 0; dy < 7; dy++) {
        for (let dx = 0; dx < 7; dx++) {
          const dark = (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
          this.modules[y + dy][x + dx] = dark;
        }
      }
    };
    addPattern(0, 0);
    addPattern(this.size - 7, 0);
    addPattern(0, this.size - 7);
  }
  _encodeData() {
    const bytes = new TextEncoder().encode(this.data);
    const bits = [];
    for (const b of bytes) {
      for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
    }
    return bits;
  }
  _placeBits(bits) {
    let idx = 0;
    for (let right = this.size - 1; right > 0; right -= 2) {
      if (right === 6) right--;
      for (let y = this.size - 1; y >= 0; y--) {
        for (let x = right; x > right - 2; x--) {
          if (!this.modules[y][x] && idx < bits.length) {
            this.modules[y][x] = bits[idx++] === 1;
          }
        }
      }
    }
  }
}

function setOnline(isOn) {
  const status = document.getElementById('status');
  if (isOn) {
    status.classList.add('on');
    status.querySelector('span').textContent = 'ONLINE';
  } else {
    status.classList.remove('on');
    status.querySelector('span').textContent = 'FALLBACK';
  }
}

function togglePanel() {
  const p = document.getElementById('panel');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
}

function copyLink() {
  const txt = document.getElementById('link').textContent.trim();
  navigator.clipboard.writeText(txt);
}

async function syncNode() {
  const url = document.getElementById('api-url').value.trim();
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
    if (!res.ok) throw new Error('Sin respuesta');
    const data = await res.json();
    document.getElementById('node-id').textContent = data.id || 'SOCXIMA-V3';
    document.getElementById('since').textContent = data.activo_desde || '---';
    const link = data.invitacion_qr || `socxima://connect?node=${data.id || 'SOCXIMA-V3'}`;
    document.getElementById('link').firstChild.textContent = link;
    generateQR(link);
    setOnline(true);
  } catch {
    setOnline(false);
  }
}

window.onload = () => generateQR('socxima://connect?node=SOCXIMA-V3');
</script>
</body>
</html>
